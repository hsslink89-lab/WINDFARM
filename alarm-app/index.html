<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>U93 알람 노트</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one-column phone app — sticky search bar, alarm card with 4 tabs, floating "조치 등록" button */
:root{
  --bg:#eef2f4; --surface:#ffffff; --ink:#14232c; --muted:#5b6b75; --line:#d5dde2;
  --steel:#1f4e63; --steel-soft:#dbe8ee; --amber:#d98a00; --amber-soft:#fff1d6;
  --ok:#2c7a4b; --ok-soft:#dff1e6; --warn:#b26a00; --crit:#b3261e; --crit-soft:#fbe3e1;
  --zone:#c9d6dc; --zone-hi:#f2a516;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1a20; --surface:#17262e; --ink:#e4edf1; --muted:#97a9b3; --line:#2b3f49;
  --steel:#7fb8d1; --steel-soft:#1f3743; --amber:#f2a516; --amber-soft:#3a2c0d;
  --ok:#6fcf97; --ok-soft:#15352a; --warn:#f2b45a; --crit:#ff8a80; --crit-soft:#3f1d1b;
  --zone:#2f4651; --zone-hi:#f2a516; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1a20; --surface:#17262e; --ink:#e4edf1; --muted:#97a9b3; --line:#2b3f49;
  --steel:#7fb8d1; --steel-soft:#1f3743; --amber:#f2a516; --amber-soft:#3a2c0d;
  --ok:#6fcf97; --ok-soft:#15352a; --warn:#f2b45a; --crit:#ff8a80; --crit-soft:#3f1d1b;
  --zone:#2f4651; --zone-hi:#f2a516; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.brand h1{font-size:18px;margin:0;letter-spacing:-.01em}
.brand h1 span{font-family:var(--f-mono);color:var(--amber);font-size:13px;margin-left:6px;letter-spacing:.04em}
.sync{font-size:12px;color:var(--muted)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:700 22px/1 var(--f-mono);letter-spacing:.08em;padding:12px 14px;border:2px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--steel)}
.search input::placeholder{font:400 15px var(--f-body);letter-spacing:0;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:14px}
.btn:focus-visible,.tab:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.btn.primary{background:var(--steel);border-color:var(--steel);color:var(--surface);font-weight:700}
.btn.ghost{background:transparent}
.nav{display:flex;gap:6px;overflow-x:auto}
.nav .chip{white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--steel);border-color:var(--steel);color:var(--surface)}
.muted{color:var(--muted)}
.small{font-size:13px}
.mono{font-family:var(--f-mono)}
section.view{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:6px}
h2{font-size:15px;margin:0;letter-spacing:.01em}
.label{font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.list{display:grid;gap:6px}
.row{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;color:var(--ink);width:100%}
.row .code{font:700 17px var(--f-mono);color:var(--steel)}
.row .nm{min-width:0;overflow-wrap:anywhere;font-size:14px}
.row .nm small{display:block;color:var(--muted);font-size:12px}
.cnt{font:500 12px var(--f-mono);color:var(--muted);text-align:right}
.lv{display:inline-block;font:700 11px var(--f-mono);padding:2px 7px;border-radius:4px;letter-spacing:.04em}
.lv.w{background:var(--amber-soft);color:var(--warn)}
.lv.e{background:var(--crit-soft);color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.hero{display:grid;gap:8px}
.hero .big{font:700 40px/1 var(--f-mono);color:var(--steel);letter-spacing:.03em}
.hero .title{font-size:17px;font-weight:700;overflow-wrap:anywhere}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.fact{border-top:2px solid var(--line);padding-top:6px;min-width:0}
.fact b{display:block;font-size:14px;overflow-wrap:anywhere}
.fact span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:none;border-bottom:3px solid transparent;padding:9px 12px;color:var(--muted);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--amber);font-weight:700}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.src{font-size:12px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.badge{display:inline-block;font-size:11px;padding:2px 7px;border-radius:4px;font-weight:700}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.chk{background:var(--amber-soft);color:var(--warn)}
.badge.new{background:var(--steel-soft);color:var(--steel)}
.note{background:var(--amber-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px}
.note b{color:var(--warn)}
.hist{display:grid;gap:8px}
.h{border-left:3px solid var(--steel-soft);padding:4px 0 4px 10px}
.h .meta{font:500 12px var(--f-mono);color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.h.mine{border-left-color:var(--amber)}
.bars{display:grid;gap:4px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:13px}
.bar .t{position:relative;padding:4px 8px;border-radius:4px;overflow:hidden;overflow-wrap:anywhere}
.bar .t i{position:absolute;inset:0 auto 0 0;background:var(--steel-soft);z-index:0}
.bar .t span{position:relative}
.bar .n{font:500 12px var(--f-mono);text-align:right;color:var(--muted)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.diagram{overflow-x:auto}
.diagram svg{width:100%;max-width:640px;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:4px}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.imgs figure{margin:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.imgs img{width:100%;height:auto;display:block}
.imgs figcaption{font-size:12px;padding:6px 8px;overflow-wrap:anywhere}
.fab{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:6;background:var(--amber);color:#1b1300;border:none;border-radius:999px;padding:14px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25)}
form.f{display:grid;gap:10px}
.f label{display:grid;gap:4px;font-size:13px;color:var(--muted)}
.f input,.f select,.f textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.f textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media (max-width:420px){.grid3{grid-template-columns:1fr 1fr}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:8px;font-size:14px;z-index:9;max-width:90vw}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:14px;border:1px dashed var(--line);border-radius:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.gstep{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.gstep:first-of-type{border-top:none;padding-top:0}
.gstep h3{margin:0;font-size:15px;display:flex;gap:8px;align-items:baseline}
.gstep h3 .no{font:700 13px var(--f-mono);color:var(--surface);background:var(--steel);border-radius:4px;padding:1px 7px}
.gimg{display:block;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.gimg img{width:100%;height:auto;display:block}
.codechips{display:flex;gap:6px;flex-wrap:wrap}
.stepbox{display:grid;gap:8px;border:1px dashed var(--line);border-radius:8px;padding:10px}
.del{color:var(--crit);border-color:transparent;background:transparent;padding:2px 6px;font-size:12px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>U93 알람 노트<span>UNISON 2MW</span></h1>
      <span class="sync" id="sync">불러오는 중…</span>
    </div>
    <form class="search" id="searchForm" autocomplete="off">
      <input id="q" type="search" inputmode="search" placeholder="알람코드 또는 키워드 (예: 5013, pitch)" aria-label="알람코드 또는 키워드">
      <button class="btn primary" type="submit">조회</button>
    </form>
    <nav class="nav" aria-label="화면">
      <button class="chip" data-go="home" aria-pressed="true">홈</button>
      <button class="chip" data-go="log" aria-pressed="false">등록된 조치</button>
      <button class="chip" data-go="about" aria-pressed="false">자료 출처</button>
    </nav>
  </header>

  <main id="main"></main>
</div>
<button class="fab" id="fab" type="button">+ 조치 등록</button>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const main=$('#main');
let ALARMS=[],BY={},HIST=[],HBY={},SOURCES=[],SOL=[],DRW=[],GUIDES=[],ALIAS={};
let db=null,assets=null,user=null,downloads=null,myId=null;
let state={view:'home',code:null,tab:'meaning',query:''};

/* ---------- reference tables (from UNS-U93(88)-S135K-000 p.4–5) ---------- */
const BRAKE={'0':'Braking 동작 안 함','10':'상용전원 피치 Feathering (공력 제동)','20':'배터리 피치 Feathering (공력 제동)','50':'배터리 Feathering 후 저속에서 기계 브레이크','100':'공력 + 기계 브레이크 즉시 동작'};
const YAW={'0':'Yaw 자동 동작','10':'Unwinding yaw 자동 동작','20':'자동 Yaw 안 됨 · Manual unwinding 필요','100':'Yaw 자동 동작 안 됨'};
const RESET={A:'자동',R:'원격(Remote)',L:'로컬(Local)',M:'현장 HMI Manual'};
function resetText(r){ if(!r||r==='-')return '—'; const p=r.replace(/\./g,',').split(','); return p.map(x=>x.split('').map(ch=>RESET[ch]||ch).join('/')).join(', ')+' ('+r+')'; }

/* ---------- concept location map ---------- */
const ZONES=[
 {id:'hub',name:'허브 · 피치',kw:/pitch|blade|hub|axis|battery|pitchmaster|fuse \d|limit sw/i,cat:'5'},
 {id:'mb',name:'메인베어링 · 로터락/브레이크',kw:/main bearing|rotor lock|rotor brake|gr rotor|rb |hyd\. ?rotor|rotor heater/i},
 {id:'gb',name:'기어박스',kw:/g\/b|gear/i,cat:'3'},
 {id:'gen',name:'발전기',kw:/\bgen\b|generator|gr gen/i,cat:'2'},
 {id:'cs',name:'냉각 시스템',kw:/\bcs\b|cooling|coolant/i,cat:'6'},
 {id:'ncu',name:'나셀 제어반 · 센서',kw:/nacelle|anemo|vane|wind|accelero|ncu|panel|ventilat|vibration/i,cat:'1'},
 {id:'yaw',name:'요 시스템',kw:/yaw|cable twist|\byb\b|unwind/i,cat:'7'},
 {id:'pcs',name:'PCS (설치 위치 현장 확인)',kw:/pcs|gsc|lsc|converter|inverter|igbt|rmio|aint|dc link|dc over|dc under|acb|du\/dt|charging/i,cat:'4'},
 {id:'tcu',name:'타워 하부 제어반',kw:/tcu|tower|ups|scada|remote|grid|comm/i,cat:'0'},
 {id:'tr',name:'변압기 · 계통',kw:/load tr|transformer|grid (over|under|volt|freq)|vcb/i}
];
function zonesFor(a){
  const n=a.name;
  const hit=ZONES.filter(z=>z.kw.test(n)).map(z=>z.id);
  if(hit.length) return [...new Set(hit)].slice(0,3);
  const z=ZONES.find(z=>z.cat===a.code[1]); return z?[z.id]:[];
}
function diagramSVG(hi){
  const f=id=>hi.includes(id)?'var(--zone-hi)':'var(--zone)';
  const s=id=>hi.includes(id)?'var(--ink)':'var(--line)';
  const tx=id=>hi.includes(id)?'700':'400';
  const box=(id,x,y,w,h,label,dash)=>`<g><rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${f(id)}" stroke="${s(id)}" stroke-width="${hi.includes(id)?2:1}" ${dash?'stroke-dasharray="5 4"':''}/><text x="${x+w/2}" y="${y+h/2+4}" text-anchor="middle" font-size="11" font-weight="${tx(id)}" fill="var(--ink)">${label}</text></g>`;
  return `<svg viewBox="0 0 640 420" role="img" aria-label="U93 점검 위치 개념도">
  <rect x="0" y="0" width="640" height="420" fill="var(--surface)"/>
  <rect x="300" y="150" width="40" height="230" fill="var(--bg)" stroke="var(--line)"/>
  <line x1="40" y1="382" x2="620" y2="382" stroke="var(--muted)" stroke-width="2"/>
  <rect x="120" y="40" width="470" height="110" rx="10" fill="var(--bg)" stroke="var(--muted)"/>
  <text x="580" y="34" text-anchor="end" font-size="11" fill="var(--muted)">나셀</text>
  <path d="M60 60 L20 10 L34 6 L72 56Z M60 120 L20 170 L34 176 L72 126Z" fill="var(--line)"/>
  ${box('hub',36,62,86,60,'허브·피치')}
  ${box('mb',130,62,92,60,'메인베어링')}
  ${box('gb',228,62,90,60,'기어박스')}
  ${box('gen',326,62,90,60,'발전기')}
  ${box('cs',424,62,74,60,'냉각')}
  ${box('ncu',506,62,78,60,'나셀제어반')}
  ${box('yaw',250,128,140,20,'요 시스템')}
  ${box('pcs',200,250,90,46,'PCS ?',true)}
  ${box('tcu',300,320,110,46,'하부 제어반')}
  ${box('tr',470,320,110,46,'변압기·계통')}
  <text x="20" y="408" font-size="11" fill="var(--muted)">개념도 · 실제 배치/단자는 해당 도면 확인 (PCS 위치는 현장 확인)</text>
  </svg>`;
}

/* ---------- general check guide (not an official Unison procedure) ---------- */
function guide(a){
  const n=a.name.toLowerCase(), out=[];
  const add=s=>{if(!out.includes(s))out.push(s)};
  add('SCADA에서 알람 발생 시각 전후 데이터(풍속·출력·온도·상태신호) 추세를 먼저 확인하고, 동시 발생 알람을 함께 기록');
  if(/mms trip/.test(n)){add('해당 MMS(모터보호차단기) 트립 상태 확인 → 복귀 전 부하(모터/히터) 과전류·절연 이상 원인 확인');add('MMS 상태 접점 → 입력 모듈 배선/단자 체결 상태 확인');}
  if(/mc fault/.test(n)){add('운전 지령 후 MC 투입 여부 확인: MC 코일 전압, 보조접점(상태 신호), 출력·입력 모듈 배선 확인');}
  if(/sensor|defect|disconnect/.test(n)&&/temp/.test(n)){add('센서 신호 범위 이탈 여부: 센서 배선 단선·접촉 불량, 커넥터 확인');add('PT100 계열이면 센서 단자에서 저항 측정 후 실제 온도와 비교 (기준값은 센서 사양서 확인)');}
  if(/temp high|over temp|temp low/.test(n)){add('실제 온도 이상인지 센서 오류인지 구분: 인접 센서·동일 부위 다른 호기 값과 비교');add('냉각/환기 경로(팬, 필터, 냉각수 유량), 히터 동작 상태 확인');}
  if(/pressure/.test(n)){add('현장 압력계 실측값과 센서 표시값 비교, 누유·누수 여부, 펌프/어큐뮬레이터 상태 확인');}
  if(/comm|communication|can|heart/.test(n)){add('통신 케이블·커넥터·광케이블 상태, 해당 노드 전원 및 상태 LED 확인');}
  if(/fuse/.test(n)){add('퓨즈 단선 시 교체 전 원인(단락·과부하·절연 저하) 확인 · 동일 규격으로 교체');}
  if(/over current|overcurrent/.test(n)){add('부하측 기계적 구속(피치 베어링/기어 등), 모터 절연저항, 드라이브 상태 확인');}
  if(/emergency|safety/.test(n)){add('비상정지 스위치 위치별 상태 확인 → 안전루프(Safety chain) 경로 순서대로 점검');}
  if(/battery/.test(n)){add('배터리 전압·충전기 상태 확인 (작업 전 잔류 에너지 방전 상태 확인 필요)');}
  if(/filter clog/.test(n)){add('필터 차압/오염 상태 확인 후 교체 이력 기록');}
  if(/grease|^gr /.test(n)){add('그리스 잔량·펌프 동작·배관 막힘 확인, 보충 이력 기록');}
  add('원인 제거 확인 후 리셋 → 재가동 후 동일 알람 재발 여부를 SCADA로 추적 (반복 알람 3013 조건 유의)');
  return out;
}

/* ---------- data loading ---------- */
async function loadStatic(){
  try{
    const [a,h,s]=await Promise.all([fetch('data/alarms.json').then(r=>r.json()),fetch('data/history.json').then(r=>r.json()),fetch('data/sources.json').then(r=>r.json()).catch(()=>[])]);
    ALARMS=a;HIST=h;SOURCES=s;
    for(const x of ALARMS)BY[x.code]=x;

function freq(){const m={};for(const r of HIST)for(const c of r.c)m[c]=(m[c]||0)+1;return m}
let FREQ=null;
function searchAlarms(q){
  q=q.trim().toLowerCase(); if(!q)return [];
  if(/^\d{1,4}$/.test(q)) return ALARMS.filter(a=>a.code.startsWith(q));
  const t=q.split(/\s+/);
  return ALARMS.filter(a=>{const s=(a.code+' '+a.name+' '+(a.desc_ko||'')+' '+(a.condition||'')+' '+a.category).toLowerCase();return t.every(w=>s.includes(w))});

function actionLines(text){return String(text||'').split(/\n+/).map(s=>s.replace(/^\s*\d+\)\s*/,'').replace(/\s+/g,' ').trim()).filter(s=>s.length>1)}
function topActions(rows,n){

    <div class="card hero"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span class="big">${esc(a.code)}</span>${lvl(a)}</div>
      <div class="title">${esc(a.name)}</div>
      <div class="small muted">${esc(a.category)} · ${esc(a.type)}${a.reset?' · Reset '+esc(a.reset):''}</div>
      ${(()=>{const from=state.aliasFrom||Object.keys(ALIAS).filter(k=>ALIAS[k].to===a.code).join(', ');return from?`<div class="note">현장 표기 <b>${esc(from)}</b> = 이 알람(${esc(a.code)})으로 기록되어 있습니다.${ALIAS[from]&&ALIAS[from].note?' '+esc(ALIAS[from].note):''}</div>`:''})()}</div>
    <div class="tabs" role="tablist">${tabs.map(([k,t])=>`<button class="tab" role="tab" data-tab="${k}" aria-selected="${state.tab===k}">${esc(t)}</button>`).join('')}</div>
    ${body}</section>`;
}

function openGuideForm(code){
  state.view='gform';
  document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-pressed','false'));
  if(!db||!assets){main.innerHTML='<section class="view"><div class="empty">계통도 가이드는 공유 저장소와 파일 업로드가 연결된 화면에서만 만들 수 있습니다.</div></section>';return}
  const stepHTML=n=>`<div class="stepbox" data-step="${n}"><b class="small">${n}번째 도면</b><label>도면 이미지<input type="file" accept="image/*" class="sFile"></label><label>제목<input class="sTitle" placeholder="예: Sheet 02 — 충전 전원측"></label><label>설명 (경로·부품·점검 포인트)<textarea class="sText" placeholder="예: Q10 퓨즈스위치 → K2 충전MC → R1 충전저항 → F9.1/F9.2 → Q1 하류 합류"></textarea></label></div>`;
  main.innerHTML=`<section class="view"><div class="card"><h2>계통도 가이드 만들기</h2><p class="small muted" style="margin:4px 0 10px">도면 캡처 여러 장을 순서대로 올리고 장마다 설명을 붙입니다. 도면번호·시트·개정판을 출처에 적어 주세요.</p>
   <form class="f" id="gForm"><label>제목<input id="gTitle" required placeholder="예: PCS 충전회로 → DC 링크 계통"></label>
   <label>연결 알람코드 (쉼표로 구분)<input id="gNewCodes" class="mono" value="${esc(code||'')}" placeholder="예: 3423, 3424"></label>
   <label>개요<textarea id="gIntro"></textarea></label>
   <label>출처 (도면번호·시트·Rev)<input id="gSrc"></label>
   <div id="gSteps" style="display:grid;gap:10px">${stepHTML(1)}</div>
   <button class="btn" type="button" id="gAdd">+ 도면 추가</button>
   <div class="actions"><button class="btn primary" type="submit">저장</button><button class="btn ghost" type="button" id="gCancel">취소</button></div></form></div></section>`;
  let n=1;
  $('#gAdd').onclick=()=>{n++;$('#gSteps').insertAdjacentHTML('beforeend',stepHTML(n))};
  $('#gCancel').onclick=()=>{state.view=code?'alarm':'home';render()};
  $('#gForm').onsubmit=async e=>{e.preventDefault();const btn=e.target.querySelector('[type=submit]');btn.disabled=true;btn.textContent='올리는 중…';
    try{const steps=[];
      for(const box of document.querySelectorAll('#gSteps .stepbox')){const f=box.querySelector('.sFile').files[0];const t=box.querySelector('.sTitle').value.trim();const x=box.querySelector('.sText').value.trim();
        if(!f&&!t&&!x)continue; let asset=''; if(f){asset=(await assets.upload(await shrink(f,2600))).id} steps.push({asset,title:t,text:x});}
      if(!steps.length){toast('도면을 한 장 이상 넣어 주세요');btn.disabled=false;btn.textContent='저장';return}
      const ref=await db.collection('guides').add({title:$('#gTitle').value.trim(),codes:$('#gNewCodes').value.split(/[\s,]+/).filter(Boolean),intro:$('#gIntro').value.trim(),source:$('#gSrc').value.trim(),steps,createdAt:new Date().toISOString(),author:myId||''});
      toast('가이드를 저장했습니다');state.view='guide';state.gid=ref.id;location.hash='g'+ref.id;render();
    }catch(err){toast('저장하지 못했습니다: '+(err.code||err.message||'오류'));btn.disabled=false;btn.textContent='저장'}};
  window.scrollTo(0,0);
}
function renderLog(){

  <ul>
   <li>알람 ${ALARMS.length}개 — UNISON ALARM LIST for U88/U93 (UNS-U93(88)-S135K-000, Rev.0, 2016-09-26, 한글판). 그중 ${ALARMS.filter(a=>a.src==='verified').length}개는 Trouble Shooting Manual(UNS-U88(93)-S502-000, 2015-09-15) 알람표와 명칭이 일치해 발생 조건·정지 동작·Reset·반복조건을 함께 표시합니다. 나머지는 <span class="badge chk">원문 대조 필요</span>로 표시됩니다.</li>
   <li>한글 설명은 PDF 텍스트 자동 추출 결과 중 알람명과 키워드가 맞는 것만 넣었습니다(${ALARMS.filter(a=>a.desc_ko).length}개). 판단 전 원문 페이지를 확인하세요.</li>
   <li>과거 이력 ${HIST.length.toLocaleString()}건 — 백수 U93 일일운전보고 중 조치/부품 기록이 있는 날: ${SOURCES.map(esc).join(', ')}. 2018–2020년 원본은 10MB를 넘어 아직 넣지 못했습니다.</li>
   <li>PCS(34xx) 알람은 U88E 매뉴얼과 U93 알람리스트의 내용이 달라, U93 알람리스트 명칭만 사용했습니다.</li>
  </ul>
  <div class="label">등록 데이터</div>
  <p>+ 조치 등록, 도면 올리기로 남긴 내용은 ${db?'이 앱의 공유 저장소에 저장되어 같은 링크로 여는 다른 기기·팀원과 함께 봅니다.':'현재 이 기기 브라우저에만 저장됩니다. 등록된 조치 화면에서 백업 파일로 저장해 두세요.'}</p>
  <p class="muted">알람 리스트 원문은 사내 Confidential 자료입니다. 링크 공유 범위에 유의하세요.</p></div></section>`;

/* ---------- registration sheet ---------- */
function openForm(code){
  const a=code&&BY[code];
  const today=new Date(Date.now()+9*3600e3).toISOString().slice(0,10);
  state.view='form';
  document.querySelectorAll('[data-go]').forEach(b=>b.setAttribute('aria-pressed','false'));
  main.innerHTML=`<section class="view"><div class="card"><h2>조치 등록</h2><p class="small muted" style="margin:4px 0 10px">확인된 사실만 적고, 추정은 원인 칸에 "추정"으로 표시하세요.</p>
  <form class="f" id="solForm">
    <div class="grid3">
      <label>알람코드<input id="fCode" class="mono" inputmode="numeric" maxlength="4" required value="${esc(code||'')}"></label>
      <label>현장<select id="fSite"><option>화순</option><option>백수</option><option>군산 MMB</option><option>기타</option></select></label>
      <label>호기<input id="fWtg" inputmode="numeric" placeholder="예: 3"></label>
    </div>
    <div id="fName" class="small muted">${a?esc(a.name):''}</div>
    <div class="grid2"><label>일자<input id="fDate" type="date" value="${today}"></label>
      <label>결과<select id="fRes"><option>해결</option><option>확인중</option><option>재발</option></select></label></div>
    <label>증상 (SCADA 값·동시 알람)<textarea id="fSym" placeholder="예: 운전 중 5013 발생, 피치 3번축 배터리 전압 저하 동시 표시"></textarea></label>
    <label>원인<textarea id="fCause" placeholder="확인된 원인 / 추정이면 '추정' 표기"></textarea></label>
    <label>조치 내용 (필수)<textarea id="fAct" required placeholder="점검 순서와 실제 조치, 리셋·재가동 조건"></textarea></label>
    <label>점검 위치 · 단자 · 측정값<input id="fLoc" placeholder="예: 허브 Axis box 3, X3 단자 7-8, 24.1V (리셋 누른 상태)"></label>
    <label>교체 부품 (품명 · 수량 · 교체 전/후 S/N)<input id="fParts"></label>
    <label>사진 (선택)<input id="fPhoto" type="file" accept="image/*"></label>
    <div class="actions"><button class="btn primary" type="submit">저장</button><button class="btn ghost" type="button" id="fCancel">취소</button></div>
  </form></div></section>`;
  $('#fCode').addEventListener('input',e=>{const x=BY[e.target.value.trim()];$('#fName').textContent=x?x.name:(e.target.value.length===4?'알람리스트에 없는 코드입니다. 코드를 다시 확인하세요.':'')});
  $('#fCancel').onclick=()=>{state.view=code?'alarm':'home';render()};
  $('#solForm').onsubmit=async e=>{
    e.preventDefault();
    const btn=e.submitter||e.target.querySelector('[type=submit]');btn.disabled=true;
    const rec={code:$('#fCode').value.trim(),site:$('#fSite').value,wtg:$('#fWtg').value.trim(),date:$('#fDate').value,result:$('#fRes').value,
      symptom:$('#fSym').value.trim(),cause:$('#fCause').value.trim(),action:$('#fAct').value.trim(),location:$('#fLoc').value.trim(),parts:$('#fParts').value.trim(),
      pinned:false,createdAt:new Date().toISOString(),author:myId||''};
    try{
      const file=$('#fPhoto').files[0];
      if(file){ if(assets){ const r=await assets.upload(await shrink(file)); rec.photo=r.id; } else toast('사진은 공유 저장소에서만 저장됩니다'); }
      if(db){ await db.collection('solutions').add(rec); }
      else { const o=lsGet(); rec.id='l'+Date.now(); o.sol.unshift(rec); lsSet(o); SOL=o.sol; }
      toast('저장했습니다');
      state.view='alarm';state.code=rec.code;state.tab='act';location.hash='a'+rec.code;render();
    }catch(err){ toast('저장하지 못했습니다: '+(err&&err.code||err&&err.message||'오류')); btn.disabled=false; }
  };
  window.scrollTo(0,0);
}
async function shrink(file,max){
  try{
    const img=await createImageBitmap(file); const s=Math.min(1,(max||1800)/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.85));
  }catch(e){return file}
}

/* ---------- events ---------- */
$('#searchForm').addEventListener('submit',e=>{e.preventDefault();const q=$('#q').value.trim();if(getAlarm(q)){go(q)}else{state.view='home';state.query=q;render()}});
$('#q').addEventListener('input',e=>{const q=e.target.value.trim();if(BY[q])return;state.view='home';state.query=q;render()});
$('#fab').addEventListener('click',()=>openForm(state.view==='alarm'?state.code:''));
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{state.view=b.dataset.go;state.query='';$('#q').value='';location.hash=b.dataset.go==='home'?'':b.dataset.go;render();window.scrollTo(0,0)}));
main.addEventListener('click',async e=>{
  const t=e.target.closest('button,a'); if(!t)return;
  if(t.dataset.code){go(t.dataset.code);return}
  if(t.dataset.guide){state.view='guide';state.gid=t.dataset.guide;location.hash=/^[A-Za-z0-9-]+$/.test(t.dataset.guide)?'g'+t.dataset.guide:'';render();window.scrollTo(0,0);return}
  if(t.dataset.newguide!==undefined){openGuideForm(t.dataset.newguide==='1'?'':t.dataset.newguide);return}
  if(t.dataset.delguide){ if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='한 번 더 누르면 삭제';return}
    try{await db.doc('guides/'+t.dataset.delguide).delete();toast('삭제했습니다');state.view='home';location.hash='';render()}catch(err){toast('삭제 권한이 없습니다')}return}
  if(t.dataset.tab){state.tab=t.dataset.tab;render();return}
  if(t.dataset.wtg!==undefined){state.wtg=t.dataset.wtg;render();return}
  if(t.id==='exportBtn'){
    const data=JSON.stringify({exported:new Date().toISOString(),solutions:SOL,drawings:DRW},null,1);
    if(downloads){try{await downloads.save({filename:'u93-alarm-notes-'+new Date().toISOString().slice(0,10)+'.json',data});toast('저장 요청을 보냈습니다')}catch(err){toast('저장이 취소되었거나 실패했습니다')}}
    else{try{await navigator.clipboard.writeText(data);toast('백업 내용을 클립보드에 복사했습니다')}catch(err){toast('이 환경에서는 백업 저장을 지원하지 않습니다')}}
    return;
  }
  if(t.dataset.pin){const s=SOL.find(x=>x.id===t.dataset.pin);if(!s)return;
    if(db){try{await db.doc('solutions/'+s.id).update({pinned:!s.pinned})}catch(err){toast('변경 권한이 없습니다')}}
    else{s.pinned=!s.pinned;const o=lsGet();o.sol=SOL;lsSet(o);render()}return}
  if(t.dataset.delsol){ if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='한 번 더 누르면 삭제';return}
    if(db){try{await db.doc('solutions/'+t.dataset.delsol).delete();toast('삭제했습니다')}catch(err){toast('삭제 권한이 없습니다')}}
    else{const o=lsGet();o.sol=o.sol.filter(x=>x.id!==t.dataset.delsol);lsSet(o);SOL=o.sol;render()}return}
  if(t.dataset.deldrw){ if(t.dataset.confirm!=='1'){t.dataset.confirm='1';t.textContent='한 번 더 누르면 삭제';return}
    try{await db.doc('drawings/'+t.dataset.deldrw).delete();toast('삭제했습니다')}catch(err){toast('삭제 권한이 없습니다')}return}
});
main.addEventListener('submit',async e=>{
  if(e.target.id==='gCodesForm'){e.preventDefault();const codes=$('#gCodes').value.split(/[\s,]+/).filter(Boolean);
    try{await db.doc('guides/'+state.gid).update({codes});toast('연결 코드를 저장했습니다')}catch(err){toast('저장하지 못했습니다')}return}
  if(e.target.id!=='drwForm')return; e.preventDefault();
  const f=$('#drwFile').files[0]; if(!f){toast('파일을 선택하세요');return}
  if(!assets||!db){toast('도면 업로드는 공유 저장소가 연결된 화면에서만 됩니다');return}
  try{const r=await assets.upload(await shrink(f));await db.collection('drawings').add({code:state.code,asset:r.id,caption:$('#drwCap').value.trim(),createdAt:new Date().toISOString(),author:myId||''});toast('도면을 올렸습니다')}
  catch(err){toast('올리지 못했습니다: '+(err.code||err.message||'오류'))}
});
function go(code){const al=!BY[code]&&aliasOf(code);state.aliasFrom=al?code:'';if(al)code=al.to;state.view='alarm';state.code=code;state.tab='meaning';state.wtg='';location.hash='a'+code;render();window.scrollTo(0,0)}
function fromHash(){const h=location.hash.slice(1);const m=h.match(/^a(\d{4})$/);if(m){const al=!BY[m[1]]&&aliasOf(m[1]);state.aliasFrom=al?m[1]:'';state.view='alarm';state.code=al?al.to:m[1];$('#q').value=m[1]}else if(/^g[A-Za-z0-9-]+$/.test(h)){state.view='guide';state.gid=h.slice(1)}else if(h==='log'||h==='about')state.view=h;render()}
window.addEventListener('hashchange',fromHash);

loadStatic().then(()=>{fromHash();connect();});
})();
</script>
